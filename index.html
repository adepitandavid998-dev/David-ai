
<!DOCTYPE html>
<html lang="en">
<head>
    
<meta name="google-site-verification" content="keswcV1tTprMbFyaqfc-vVt0PD9CWP4azfENyQehakA" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAVID AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>DAVID AI</h2>
    <span>PERSONAL AI ASSISTANT</span>
  </header>

  <main>
    <div class="core">
      <div class="circle">
        <span>DAVID</span>
      </div>
    </div>

    <h2 id="status">Hello, I'm David.</h2>
    <p>Your personal AI assistant.</p>

    <div class="chat" id="chat">
      <div class="message bot">
        Hello! I'm David. How can I help you today?
      </div>
    </div>

    <div class="controls">
      <input id="userInput" type="text"
        placeholder="Talk to David...">
      <button onclick="sendMessage()">SEND</button>
    </div>

    <button class="voice" onclick="startListening()">
      🎤 TALK TO DAVID
    </button>
  </main>

  <footer>DAVID AI · PERSONAL ASSISTANT</footer>

  <script src="script.js"></script>
</body>
</html>
